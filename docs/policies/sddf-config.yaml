# Valores por defecto para todos los tipos
# este archivo debe diseñarse y reconstruiserse para ser fácilmente extendible y adaptable a diferentes proyectos y tecnologías
defaults:
  unit:
    command: "pnpm run test:unit"
    required: false
  component:
    command_template: "pnpm run test:component -- {{test_file}}"
    required: false
  integration:
    command: "pnpm run test:integration"
    required: false
  contract:
    command: "pnpm run test:contract"
    required: false
  e2e:
    command: "pnpm run test:e2e"
    required: false
  performance:
    command: "pnpm run test:performance"
    required: false
  eval:
    command: "pnpm run test:eval"
    required: true

complementary_skills:
  specifying:
    skills:  none
    description: "Habilidades para la fase de especificación (definir qué probar, no ejecutar tests)"

  plan:
    skills:
      - name: design-skill-architecture
        type: reference
        references_path: ".claude/skills/skill-master/references"
        description: "Guías de buenas prácticas para diseñar skills SDDF"
        required: false



