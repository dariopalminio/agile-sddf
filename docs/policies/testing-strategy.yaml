# Valores por defecto para todos los tipos
defaults:
  unit:
    command: "npm run test:unit"
    required: false
  component:
    command_template: "npm run test:component -- {{test_file}}"
    required: false
  integration:
    command: "npm run test:integration"
    required: false
  contract:
    command: "npm run test:contract"
    required: false
  e2e:
    command: "npm run test:e2e"
    required: false
  performance:
    command: "npm run test:performance"
    required: false
  eval:
    command: "npm run test:eval"
    required: true

# Ruta donde se guardarán los reportes (relativa a la raíz del proyecto)
reports_dir: "reports/"

regression:
  # Perfil rápido: se ejecuta en cada PR o después de cambios en una feature
  smoke:
    required: false
    description: "Suite rápida para validar cambios incrementales (feature branch)"
    # Comandos específicos para este perfil (sobrescriben los defaults)
    e2e: "npm run test:e2e:smoke"          # solo escenarios críticos (~10% de los tests)
    integration: "npm run test:integration:smoke"  # solo endpoints principales
    # Opcional: unit tests de los módulos modificados (si tienes tooling)
    unit: "npm run test:unit -- --changedSince=main"
    # Otros tipos se omiten o usan su comando por defecto si no se listan

  # Perfil completo: se ejecuta antes de un release (lento, exhaustivo)
  full:
    required: false
    description: "Suite completa de regresión (antes de releases importantes)"
    e2e: "npm run test:e2e:full"           # todos los escenarios E2E
    integration: "npm run test:integration"
    contract: "npm run test:contract"
    performance: "npm run test:performance"
    unit: "npm run test:unit"               # todos los unit tests
    component: "npm run test:component"     # todos los componentes
    eval: "npm run test:eval"               # todos los evals
