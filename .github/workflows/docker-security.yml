name: Docker Security Scan

on:
  push:
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
  pull_request:
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f Dockerfile.dev -t agile-sddf-dev:ci .

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agile-sddf-dev:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
