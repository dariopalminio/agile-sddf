name: Skill Security Audit

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'scripts/**'
      - 'docs/constitution.md'
      - 'docs/policies/**'
      - 'docs/guardrails/**'
      - '.github/workflows/**'
      - 'SECURITY.md'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'scripts/**'
      - 'docs/constitution.md'
      - 'docs/policies/**'
      - 'docs/guardrails/**'
      - '.github/workflows/**'
      - 'SECURITY.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-shielder:
    name: Audit skills with Skill Shielder
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Prepare audit report
        run: ': > audit-report.txt'

      - name: Verify workflow contract
        run: |
          set -o pipefail
          node scripts/verify-skill-security-workflow.js 2>&1 | tee -a audit-report.txt

      - name: Clone Skill Shielder
        env:
          SKILL_SHIELDER_REVISION: b204cecb2d26fccaca0e4121eae94e352e210126
        run: |
          set -o pipefail
          git clone --no-checkout https://github.com/p3nchan/skill-shielder.git /tmp/shielder 2>&1 | tee -a audit-report.txt
          git -C /tmp/shielder checkout --detach "$SKILL_SHIELDER_REVISION" 2>&1 | tee -a audit-report.txt
          test "$(git -C /tmp/shielder rev-parse HEAD)" = "$SKILL_SHIELDER_REVISION"

      - name: Make scripts executable
        run: |
          set -o pipefail
          chmod +x /tmp/shielder/shield.sh /tmp/shielder/scanners/*.sh 2>&1 | tee -a audit-report.txt

      - name: Audit isolated sources
        id: audit
        run: |
          set +e
          set -o pipefail
          printf '\n===== Verifying security documents =====\n' >> audit-report.txt
          node scripts/verify-security-documents.js 2>&1 | tee -a audit-report.txt
          documents_exit=${PIPESTATUS[0]}

          printf '\n===== Auditing isolated Skill Shielder targets =====\n' >> audit-report.txt
          node scripts/run-skill-shielder-audit.js \
            --shielder /tmp/shielder/shield.sh \
            --skills-dir skills \
            --report audit-report.txt
          scanner_exit=$?

          audit_exit=0
          if [ "$documents_exit" -ne 0 ] || [ "$scanner_exit" -eq 3 ]; then
            audit_exit=3
          elif [ "$scanner_exit" -eq 2 ]; then
            audit_exit=2
          elif [ "$scanner_exit" -ne 0 ] && [ "$scanner_exit" -ne 1 ]; then
            audit_exit=3
          fi

          printf '\nSecurity documents exit code: %s\n' "$documents_exit" >> audit-report.txt
          printf 'Skill Shielder exit code: %s\n' "$scanner_exit" >> audit-report.txt
          printf 'Audit exit code: %s\n' "$audit_exit" >> audit-report.txt
          echo "exit_code=$audit_exit" >> "$GITHUB_OUTPUT"
          exit "$audit_exit"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-audit-report
          path: audit-report.txt
          retention-days: 14
