name: Skill Security Audit

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'scripts/**'
      - 'docs/constitution.md'
      - 'docs/policies/**'
      - 'docs/guardrails/**'
      - '.github/workflows/**'
      - 'SECURITY.md'
      - 'AGENTS.md'
  push:
    branches:
      - main
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'scripts/**'
      - 'docs/constitution.md'
      - 'docs/policies/**'
      - 'docs/guardrails/**'
      - '.github/workflows/**'
      - 'SECURITY.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-shielder:
    name: Audit skills with Skill Shielder
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare audit report
        run: ': > audit-report.txt'

      - name: Verify workflow contract
        run: |
          set -o pipefail
          node scripts/verify-skill-security-workflow.js 2>&1 | tee -a audit-report.txt

      - name: Clone Skill Shielder
        env:
          SKILL_SHIELDER_REVISION: b204cecb2d26fccaca0e4121eae94e352e210126
        run: |
          set -o pipefail
          git clone --no-checkout https://github.com/p3nchan/skill-shielder.git /tmp/shielder 2>&1 | tee -a audit-report.txt
          git -C /tmp/shielder checkout --detach "$SKILL_SHIELDER_REVISION" 2>&1 | tee -a audit-report.txt
          test "$(git -C /tmp/shielder rev-parse HEAD)" = "$SKILL_SHIELDER_REVISION"

      - name: Make scripts executable
        run: |
          set -o pipefail
          chmod +x /tmp/shielder/shield.sh /tmp/shielder/scanners/*.sh 2>&1 | tee -a audit-report.txt

      - name: Audit protected sources
        id: audit
        run: |
          set +e
          scan_exit=0
          for target in skills agents scripts docs/constitution.md docs/policies docs/guardrails .github/workflows; do
            printf '\n===== Auditing %s =====\n' "$target" >> audit-report.txt
            /tmp/shielder/shield.sh "$target" >> audit-report.txt 2>&1
            target_exit=$?
            if [ "$target_exit" -ne 0 ] && [ "$scan_exit" -eq 0 ]; then
              scan_exit=$target_exit
            fi
          done
          printf '\nSkill Shielder exit code: %s\n' "$scan_exit" >> audit-report.txt
          echo "exit_code=$scan_exit" >> "$GITHUB_OUTPUT"
          exit "$scan_exit"

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-audit-report
          path: audit-report.txt
          retention-days: 14
