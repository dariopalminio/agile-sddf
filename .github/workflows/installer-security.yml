name: Installer Security Regression

on:
  pull_request:
    paths:
      - 'scripts/install.js'
      - 'scripts/postinstall.js'
      - 'scripts/cli.js'
      - 'test/install.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/installer-security.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/install.js'
      - 'scripts/postinstall.js'
      - 'scripts/cli.js'
      - 'test/install.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - 'SECURITY.md'
      - '.github/workflows/installer-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer-security:
    name: Test installer target containment
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Test installer target containment
        run: npm run test:installer

      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
