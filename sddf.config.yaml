# Configuración SDDF — personalizar para cada proyecto
# Reemplaza los comandos de prueba con los de tu stack tecnológico y runner de tests

# Raíz versionada de los artefactos SDDF. SDDF_ROOT solo la sobrescribe si es válido.
root: docs
profile: dogfood
stack: sddf-authoring

defaults:
  delivery-model: batch # batch | continuous

verify:
  unit:
    command: "npm run test:installer"
    required: true
  component:
    command: "npm run test:eval:runner"
    required: true
  integration:
    command: "node scripts/audit-root-resolution.js"
    required: true
  contract:
    command: "npm run test:contract"
    required: false
  e2e:
    command: "npm run test:e2e:smoke"
    required: false
  e2e-smoke:
    command: "npm run test:e2e:smoke"
    required: false
  e2e-sanity:
    command: "npm run test:e2e:sanity"
    required: false
  e2e-regression:
    command: "npm run test:e2e:regression"
    required: false
  e2e-file:
    command: "npm run test:e2e:file -- {{test_file_path}}"
    required: false
  performance:
    command: "npm run test:performance"
    required: false
  eval:
    command: "npm run test:eval" # npm run test:eval -- sddf-init --only TC-001 --eval-runner codex
    required: false

implement:
  test_generators:
    - type: unit
      skill: none
      required: false
    - type: e2e
      skill: none
      required: false
    - type: eval
      skill: skill-test-evals
      required: true
  code_generators:
    - layer: monolithic # este repo no tiene capas frontend/backend/database — todo el "código de producción" son skills
      skill: skill-master
      required: true
    - layer: frontend
      skill: none
      required: false
    - layer: backend
      skill: none
      required: false
    - layer: database
      skill: none
      required: false

# DoD de historia por etapa (STORY-101): etapa → slug del guardrail en $SPECS_BASE/guardrails/<slug>.md.
# Opcional: sin esta sección cada skill usa la convención dod-story-<etapa>.md. Un proyecto
# consumidor sobrescribe aquí una etapa (p. ej. implement: dod-story-implement-acme) sin tocar skills.
guardrails:
  dod:
    story:
      specify: dod-story-specify
      plan: dod-story-plan
      implement: dod-story-implement
      code-review: dod-story-code-review
      verify: dod-story-verify
      acceptance: dod-story-acceptance
      deliver: dod-story-deliver
