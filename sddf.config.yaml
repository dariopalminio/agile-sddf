# Configuración SDDF — personalizar para cada proyecto
# Reemplaza los comandos de prueba con los de tu stack tecnológico y runner de tests

defaults:
  delivery-model: batch # batch | continuous

verify:
  unit:
    command: "npm run test:unit"
    required: true
  component:
    command_template: "npm run test:component:file -- {{test_file_path}}"
    required: true
  integration:
    command: "npm run test:integration"
    required: false
  contract:
    command: "npm run test:contract"
    required: false
  e2e:
    command: "npm run test:e2e:smoke"
    required: false
  e2e-smoke:
    command: "npm run test:e2e:smoke"
    required: false
  e2e-sanity:
    command: "npm run test:e2e:sanity"
    required: false
  e2e-regression:
    command: "npm run test:e2e:regression"
    required: false
  e2e-file:
    command: "npm run test:e2e:file -- {{test_file_path}}"
    required: false
  performance:
    command: "npm run test:performance"
    required: false
  eval:
    command: "npm run test:eval"
    required: true

implement:
  test_generators:
    - type: unit
      skill: none
      required: false
    - type: e2e
      skill: none
      required: false
    - type: eval
      skill: skill-test-evals
      required: true
  code_generators:
    skill: skill-master
    required: true
